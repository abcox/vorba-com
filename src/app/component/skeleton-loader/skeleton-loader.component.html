<ul class="space-y-2">
    @switch(skeletonStyle) {
        @case('list') {
            <ng-container *ngTemplateOutlet="listSkeletonLoaderTemplate"></ng-container>
        }
    }
</ul>

<ng-template #listSkeletonLoaderTemplate>
<!--     <div class="skeleton h-4 w-3/4 rounded"></div>
    <div class="skeleton h-4 w-full rounded"></div>
    <div class="skeleton h-4 w-5/6 rounded"></div>
 -->    
    @for (y of rowArray; track $index) {
        <li class="animate-pulse flex gap-4">
            @for (x of columnArray; track $index) {
                <div class="h-5 bg-gray-300 dark:bg-gray-600 rounded w-1/3"></div>
                <!-- <div class="h-4 bg-gray-300 dark:bg-gray-600 rounded w-1/3"></div>
                <div class="h-4 bg-gray-200 dark:bg-gray-700 rounded w-1/4"></div>
             -->}
        </li>
    }
</ng-template>
