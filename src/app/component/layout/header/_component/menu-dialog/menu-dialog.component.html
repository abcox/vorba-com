<div *ngIf="menuOpen()" data-testid="menu-dialog" class="menu-dialog fixed top-4 right-6 shadow-lg p-4 min-w-[200px]" [style.background-color]="'var(--background-color)'">
    <div class="flex justify-end">
        <mat-icon class="cursor-pointer hover:text-gray-600" (click)="closeMenu()">close</mat-icon>
    </div>
    <div class="mt-2">
        <app-menu-list [menuItems]="menuListForDisplay()"></app-menu-list>
    </div>
</div>

<ng-template
    #themeTemplate
    let-isLightThemeSignal="isLightThemeSignal"
    let-toggleTheme="toggleTheme"
    let-swatchSignal="swatchSignal"
    let-swatchOptions="swatchOptions"
    let-setSwatch="setSwatch"
    let-fontSignal="fontSignal"
    let-fontOptions="fontOptions"
    let-setFont="setFont"
    >
    <div class="theme-controls mt-4">
        <div class="theme-toggle-row">
            <span class="menu-control-label">{{ isLightThemeSignal() ? 'Dark mode' : 'Light mode' }}</span>
            <!-- <mat-slide-toggle
                class="theme-toggle"
                [ngModel]="!isLightThemeSignal()"
                (change)="toggleTheme()">
            </mat-slide-toggle> -->            
            <!-- <button mat-icon-button (click)="toggleTheme()" class="theme-toggle">
                <mat-icon>{{ isLightThemeSignal() ? 'dark_mode' : 'light_mode' }}</mat-icon>
            </button> -->
            <mat-slide-toggle
                class="theme-toggle ml-5"
                [ngModel]="isLightThemeSignal()"
                (change)="toggleTheme()"
                matTooltip="Alt+T">
            </mat-slide-toggle>
        </div>
        <label class="menu-control-label" for="swatch-select">Color Swatch</label>
        <select
            data-testid="swatch-select"
            id="swatch-select"
            class="swatch-select"
            [ngModel]="swatchSignal()"
            (ngModelChange)="setSwatch($event)">
            @for (swatch of swatchOptions; track swatch.value) {
                <option [value]="swatch.value">{{ swatch.label }}</option>
            }
        </select>

        <label class="menu-control-label" for="font-select">Typography</label>
        <select
            data-testid="font-select"
            id="font-select"
            class="swatch-select"
            [ngModel]="fontSignal()"
            (ngModelChange)="setFont($event)">
            @for (font of fontOptions; track font.value) {
                <option [value]="font.value">{{ font.label }}</option>
            }
        </select>
    </div>
</ng-template>
