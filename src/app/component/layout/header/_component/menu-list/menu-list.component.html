<ul class="flex flex-col gap-2">
  @for (item of menuItems(); track $index) {
    @if (item.type === 'divider') {
      <li class="menu-divider h-px"></li>
    } @else {
      <li>
        @if (item.template) {
          <!-- Debug: {{ item.template ? 'Template exists' : 'No template' }} -->
          <ng-container *ngTemplateOutlet="item.template; context: item.templateContext"></ng-container>
          @if (item.label) {
            <div class="menu-section-label pt-3" [innerHTML]="item.label"></div>
          }
        } @else {
          <button mat-button class="menu-item-button flex items-center gap-2"
            (click)="item.action ? item.action() :
              item.routerLink ? router.navigate([item.routerLink]) : null">
            @if (item.icon) {
              <mat-icon>{{ item.icon }}</mat-icon>
            }
            @if (item.label) {
              <div class="menu-item-label" [innerHTML]="item.label"></div>
            }
          </button>
          <!-- <div>
            <a [routerLink]="item.routerLink" 
              class="block px-4 py-2 hover:bg-opacity-10 dark:hover:bg-gray-800"
              style="background-color: transparent; color: var(--md-sys-color-on-surface);"
              onmouseover="this.style.backgroundColor='var(--md-sys-color-primary)'"
              onmouseout="this.style.backgroundColor='transparent'">
              @if (item.icon) {
                <mat-icon>{{ item.icon }}</mat-icon>
              }
              <span>{{ item.label }}</span>
            </a>
          </div> -->
        }
      </li>
    }
  }
</ul>
