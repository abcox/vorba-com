<div class="mt-10">
    @if (errorMessage()) {
        <div class="flex flex-col items-center justify-center mt-10">
            <p>{{ errorMessage() }}</p>
            <p>Example: <code>/payment?pi=pi_123</code></p>
        </div>
    } @else {
        <app-payment-form [intent]="paymentIntent()"></app-payment-form>
    }
</div>
