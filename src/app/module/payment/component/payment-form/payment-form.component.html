@if (!intent()) {
  <div class="payment-form__state">
    <p>Loading payment details...</p>
  </div>
} @else if (paymentReceived()) {
  <h1>Thank you!</h1>
  <div class="payment-form__state">
    <p>
      Payment complete.
      <a [href]="receiptUrl()" target="_blank">View your receipt
        <mat-icon class="icon-small">open_in_new</mat-icon>
      </a>
    </p>
  </div>
} @else {
  <h1>{{ heading() }}</h1>
  <form id="payment-form" (submit)="onSubmit($event)">
    <div id="payment-element"></div>
    <button type="submit">Pay</button>
  </form>
}
