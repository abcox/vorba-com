<div class="contact-form-container">
  <div class="form-header">
    <button mat-stroked-button (click)="cancel()">
      <mat-icon>arrow_back</mat-icon>
      Back to contacts
    </button>
  </div>

  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>{{ pageTitle }}</mat-card-title>
      <mat-card-subtitle>
        {{ mode === 'edit' ? 'Update contact details' : 'Create a new contact record' }}
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <div *ngIf="errorMessage" class="form-error-banner">{{ errorMessage }}</div>
      <div *ngIf="isLoading" class="form-loading">Loading…</div>

      <form *ngIf="!isLoading" [formGroup]="form" (ngSubmit)="submit()" class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>First name</mat-label>
          <input matInput type="text" formControlName="firstName" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Last name</mat-label>
          <input matInput type="text" formControlName="lastName" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Phone</mat-label>
          <input matInput type="text" formControlName="phone" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Company</mat-label>
          <input matInput type="text" formControlName="company" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Status</mat-label>
          <mat-select formControlName="status">
            <mat-option *ngFor="let option of statusOptions" [value]="option.value">
              {{ option.label }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Source</mat-label>
          <mat-select formControlName="source">
            <mat-option *ngFor="let option of sourceOptions" [value]="option.value">
              {{ option.label }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Title</mat-label>
          <input matInput type="text" formControlName="title" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Department</mat-label>
          <input matInput type="text" formControlName="department" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full">
          <mat-label>Notes</mat-label>
          <textarea matInput rows="5" formControlName="notes"></textarea>
        </mat-form-field>

        <div class="actions full">
          <button mat-stroked-button type="button" (click)="cancel()" [disabled]="isSaving">Cancel</button>
          <button
            *ngIf="mode === 'create'"
            mat-stroked-button
            type="button"
            (click)="clearForm()"
            [disabled]="isSaving">
            Clear
          </button>
          <button mat-raised-button color="primary" type="submit" [disabled]="isSaving || form.invalid">
            {{ isSaving ? 'Saving...' : mode === 'edit' ? 'Save changes' : 'Create contact' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
